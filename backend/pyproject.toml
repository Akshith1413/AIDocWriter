[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aureview-api"
version = "1.0.0"
description = "Agentic professional document drafting and review API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.7,<3",
  "pyjwt>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "email-validator>=2.2,<3",
  "httpx>=0.28,<1",
  "langgraph>=0.3,<1",
  "langchain-core>=0.3.0,<1",
  "langchain-openai>=0.2.0,<1",
  "langchain-anthropic>=0.3.0,<1",
  "langchain-groq>=0.2.0,<1",
  "markdown>=3.7,<4",
  "python-docx>=1.1,<2",
  "bleach>=6.2,<7",
  "python-multipart>=0.0.20,<1",
  "typer>=0.15,<1",
  "rich>=13.9,<15",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1"]

[project.scripts]
aureview = "app.cli:app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
